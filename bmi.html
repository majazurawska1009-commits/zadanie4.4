<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator BMI</title>

<script>
function bmi() {

    var wzrost = parseFloat(document.getElementById("wzrost").value);
    var waga = parseFloat(document.getElementById("waga").value);

    if (isNaN(wzrost) || isNaN(waga)) {
        alert("Podaj poprawne wartości liczbowe!");
        return;
    }

    if (wzrost <= 100 || wzrost >= 250) {
        alert("Wzrost musi być w zakresie 100 - 250 cm");
        return;
    }

    if (waga <= 0 || waga >= 200) {
        alert("Waga musi być w zakresie 0 - 200 kg");
        return;
    }

    var wynik = waga / (wzrost * wzrost / 10000);

    // +2% po śniadaniu
    if (document.getElementById("sniadanie").checked) {
        wynik *= 1.02;
    }

    // narodowość
    var narodowosc = "";
    var radio = document.getElementsByName("narodowosc");

    for (var i = 0; i < radio.length; i++) {
        if (radio[i].checked) {
            narodowosc = radio[i].value;
        }
    }

    if (narodowosc === "") {
        alert("Wybierz narodowość!");
        return;
    }

    if (narodowosc === "Chińczyk") {
        wynik *= 0.97; // -3%
    } else if (narodowosc === "Amerykanin") {
        wynik *= 1.03; // +3%
    }
    else{  wynik *= 1.05;} // 

    wynik = wynik.toFixed(2);

    var kategoria = "";

    if (wynik < 18.5) {
        kategoria = "Niedowaga";
    } else if (wynik < 25) {
        kategoria = "Waga prawidłowa";
    } else if (wynik < 30) {
        kategoria = "Nadwaga";
    } else {
        kategoria = "Otyłość";
    }

    document.getElementById("wynik").innerHTML =
        "Narodowość: " + narodowosc + "<br>" +
        "Twoje BMI: " + wynik + "<br>" +
        "Kategoria: " + kategoria;
}
</script>
</head>

<body>

<h2>Kalkulator BMI</h2>

Wzrost (cm)=<input type="number" id="wzrost"><br>
Waga (kg)=<input type="number" id="waga"><br><br>

<input type="checkbox" id="sniadanie"> Jestem po śniadaniu<br><br>

Wybierz narodowość:<br>
<input type="radio" name="narodowosc" value="Chińczyk"> Chińczyk<br>
